<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CleanTik - Download Video TikTok</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #00aaff, #ffffff);
      color: #333;
      text-align: center;
      padding: 0 20px;
    }

    .header {
      margin-top: 50px;
    }

    .header h1 {
      font-size: 2.5em;
      color: #0077cc;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 1.2em;
      color: #555;
    }

    .content {
      margin-top: 30px;
    }

    .description {
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    .download-box {
      margin-top: 20px;
    }

    .input-url {
      width: 80%;
      max-width: 400px;
      padding: 12px;
      font-size: 1em;
      border: 2px solid #0077cc;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-download {
      display: block;
      width: 80%;
      max-width: 400px;
      padding: 12px;
      background-color: #0077cc;
      color: #fff;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn-download:hover {
      background-color: #005fa3;
    }

    .footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>CleanTik</h1>
    <p class="tagline">Download Video TikTok Bersih dan Cepat</p>
  </header>

  <main class="content">
    <p class="description">Nikmati download video TikTok kualitas HD tanpa watermark. Gratis selamanya!</p>
    
    <div class="download-box">
      <input type="text" placeholder="Masukkan URL Video TikTok" class="input-url">
      <button class="btn-download">Unduh Sekarang</button>
    </div>
  </main>

  <footer class="footer">
    <p>© 2025 CleanTik. Semua Hak Dilindungi.</p>
  </footer>
</body>
</html>
