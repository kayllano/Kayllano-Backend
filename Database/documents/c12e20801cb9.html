<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vortex Prompt - Text Collection</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle at 0% 0%, #0a0a1a, #05050f);
    color: #ffffff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
}

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: rgba(15, 15, 35, 0.6);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, #4f46e5, #8b5cf6);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(135deg, #6366f1, #a78bfa);
}

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 8, 18, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(79, 70, 229, 0.25);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1.25rem;
}

.logo {
    font-size: 1.9rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff, #a78bfa, #4f46e5);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
    animation: shimmer 3s ease infinite;
}

@keyframes shimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.logo span {
    background: linear-gradient(135deg, #c4b5fd, #818cf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
}

.search-bar {
    flex: 1;
    max-width: 420px;
    display: flex;
    align-items: center;
    background: rgba(20, 20, 40, 0.6);
    backdrop-filter: blur(8px);
    border-radius: 60px;
    padding: 0.6rem 1.3rem;
    gap: 0.75rem;
    border: 1px solid rgba(79, 70, 229, 0.35);
    transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

.search-bar:focus-within {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2), 0 0 20px rgba(79, 70, 229, 0.3);
    background: rgba(25, 25, 50, 0.8);
    transform: scale(1.01);
}

.search-bar input {
    background: transparent;
    border: none;
    outline: none;
    color: #f0f0ff;
    width: 100%;
    font-size: 0.95rem;
    font-weight: 500;
}

.search-bar input::placeholder {
    color: rgba(160, 160, 200, 0.6);
    font-weight: 400;
}

.search-bar button {
    background: transparent;
    border: none;
    color: #8b5cf6;
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: transform 0.2s ease;
}

.search-bar button:hover {
    transform: scale(1.1);
    color: #a78bfa;
}

.add-prompt-btn {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border: none;
    padding: 0.65rem 1.6rem;
    border-radius: 60px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    font-size: 0.9rem;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
}

.add-prompt-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 10px 28px rgba(79, 70, 229, 0.5);
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

.hero-section {
    text-align: center;
    padding: 4rem 2rem 3rem;
    position: relative;
}

.hero-section::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #8b5cf6, #4f46e5, #8b5cf6, transparent);
    border-radius: 5px;
}

.hero-section h1 {
    font-size: 3.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff, #c4b5fd, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 1rem;
    letter-spacing: -1px;
}

.hero-section p {
    color: rgba(200, 200, 250, 0.7);
    font-size: 1.2rem;
    font-weight: 400;
    max-width: 550px;
    margin: 0 auto;
}

.prompts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 2rem;
    padding: 2.5rem;
    max-width: 1500px;
    margin: 0 auto;
}

.prompt-card {
    background: linear-gradient(135deg, rgba(25, 25, 45, 0.7), rgba(15, 15, 35, 0.8));
    backdrop-filter: blur(12px);
    border-radius: 28px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid rgba(79, 70, 229, 0.25);
    transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

.prompt-card:hover {
    transform: translateY(-10px) scale(1.01);
    border-color: rgba(139, 92, 246, 0.6);
    box-shadow: 0 25px 45px rgba(79, 70, 229, 0.3), 0 0 0 1px rgba(139, 92, 246, 0.2);
}

.prompt-card-image {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
}

.prompt-card:hover .prompt-card-image {
    transform: scale(1.03);
}

.prompt-card-content {
    padding: 1.4rem;
}

.prompt-card-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin-bottom: 0.6rem;
    background: linear-gradient(135deg, #fff, #e0d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.prompt-card-category {
    display: inline-block;
    background: rgba(139, 92, 246, 0.2);
    padding: 4px 14px;
    border-radius: 40px;
    font-size: 0.7rem;
    font-weight: 600;
    color: #c4b5fd;
    letter-spacing: 0.3px;
    margin-bottom: 0.9rem;
    border: 0.5px solid rgba(139, 92, 246, 0.4);
}

.prompt-card-preview {
    font-size: 0.85rem;
    color: rgba(210, 210, 250, 0.7);
    line-height: 1.5;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}

.empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 5rem 2rem;
    color: rgba(200, 200, 240, 0.5);
    font-size: 1.2rem;
    background: rgba(20, 20, 40, 0.4);
    border-radius: 48px;
    backdrop-filter: blur(8px);
    border: 1px dashed rgba(139, 92, 246, 0.4);
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(20px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal-overlay.active {
    display: flex;
}

.modal-container {
    background: linear-gradient(145deg, #12122a, #0a0a1a);
    border-radius: 36px;
    max-width: 560px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    border: 1px solid rgba(79, 70, 229, 0.4);
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(139, 92, 246, 0.2);
    animation: slideUp 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.6rem 2rem;
    border-bottom: 1px solid rgba(79, 70, 229, 0.25);
}

.modal-header h2 {
    font-size: 1.7rem;
    font-weight: 700;
    background: linear-gradient(135deg, #fff, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.close-modal {
    background: rgba(255, 255, 255, 0.05);
    border: none;
    font-size: 1.9rem;
    cursor: pointer;
    color: rgba(200, 200, 240, 0.7);
    transition: all 0.2s ease;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close-modal:hover {
    background: rgba(139, 92, 246, 0.3);
    color: white;
    transform: rotate(90deg);
}

.form-group {
    padding: 0.9rem 2rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.6rem;
    font-weight: 600;
    color: #c4b5fd;
    font-size: 0.85rem;
    letter-spacing: 0.3px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    background: rgba(5, 5, 15, 0.7);
    border: 1.5px solid rgba(79, 70, 229, 0.35);
    border-radius: 18px;
    padding: 0.85rem 1.2rem;
    color: #f0f0ff;
    font-size: 0.95rem;
    transition: all 0.25s ease;
    font-weight: 500;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    background: rgba(10, 10, 25, 0.9);
}

.form-group small {
    display: block;
    margin-top: 0.4rem;
    color: rgba(180, 180, 220, 0.5);
    font-size: 0.7rem;
}

.submit-btn {
    margin: 1.2rem 2rem 2rem;
    width: calc(100% - 4rem);
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border: none;
    padding: 1rem;
    border-radius: 60px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    transition: all 0.25s ease;
    font-size: 1rem;
    letter-spacing: 0.5px;
}

.submit-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 8px 25px rgba(79, 70, 229, 0.5);
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

.detail-page {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 10%, #0a0a1a, #020208);
    z-index: 1000;
    overflow-y: auto;
    display: none;
}

.detail-page.active {
    display: block;
    animation: fadeScale 0.35s ease;
}

@keyframes fadeScale {
    from {
        opacity: 0;
        transform: scale(0.98);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.close-detail {
    position: fixed;
    top: 24px;
    right: 28px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.9rem;
    cursor: pointer;
    z-index: 1010;
    color: #e0e0ff;
    border: 1px solid rgba(139, 92, 246, 0.5);
    transition: all 0.25s ease;
}

.close-detail:hover {
    background: #7c3aed;
    transform: rotate(90deg) scale(1.05);
    border-color: #a78bfa;
}

.detail-container {
    max-width: 1050px;
    margin: 0 auto;
    padding: 2rem;
}

.detail-image-section {
    width: 100%;
    margin-bottom: 2rem;
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
    transition: transform 0.3s ease;
}

.detail-image-section:hover {
    transform: scale(1.01);
}

.detail-image-section img {
    width: 100%;
    max-height: 520px;
    object-fit: cover;
    display: block;
}

.detail-content-section {
    background: rgba(20, 20, 40, 0.6);
    backdrop-filter: blur(20px);
    border-radius: 32px;
    padding: 2.2rem;
    border: 1px solid rgba(79, 70, 229, 0.35);
    box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
}

.detail-header {
    margin-bottom: 1.8rem;
}

.detail-header h1 {
    font-size: 2.4rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff, #d8cfff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.75rem;
}

.detail-category {
    display: inline-block;
    background: rgba(139, 92, 246, 0.2);
    padding: 5px 18px;
    border-radius: 40px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #c4b5fd;
    border: 0.5px solid rgba(139, 92, 246, 0.5);
}

.detail-prompt-box {
    background: rgba(0, 0, 0, 0.5);
    border-radius: 28px;
    padding: 1.8rem;
    margin: 1.8rem 0;
    border: 1px solid rgba(139, 92, 246, 0.3);
    transition: box-shadow 0.2s;
}

.detail-prompt-box:hover {
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
}

.prompt-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #8b5cf6;
    margin-bottom: 1.2rem;
    font-weight: 700;
}

.prompt-text {
    font-size: 1.02rem;
    line-height: 1.7;
    color: #e8e8ff;
    white-space: pre-wrap;
    word-break: break-word;
}

.copy-btn {
    margin-top: 1.8rem;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    border: none;
    padding: 0.7rem 1.8rem;
    border-radius: 60px;
    color: white;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.25s ease;
    font-size: 0.85rem;
}

.copy-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 18px rgba(79, 70, 229, 0.4);
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}

.detail-footer {
    text-align: center;
    padding: 2.2rem;
    color: rgba(180, 180, 220, 0.5);
    font-size: 0.85rem;
    border-top: 1px solid rgba(79, 70, 229, 0.2);
    margin-top: 2.5rem;
    font-weight: 500;
}

@media (max-width: 768px) {
    .header {
        padding: 0.9rem 1.2rem;
    }
    
    .logo {
        font-size: 1.4rem;
    }
    
    .hero-section h1 {
        font-size: 2.4rem;
    }
    
    .hero-section p {
        font-size: 1rem;
    }
    
    .prompts-grid {
        padding: 1.5rem;
        gap: 1.2rem;
        grid-template-columns: 1fr;
    }
    
    .detail-container {
        padding: 1rem;
    }
    
    .detail-content-section {
        padding: 1.4rem;
    }
    
    .detail-header h1 {
        font-size: 1.7rem;
    }
    
    .modal-header h2 {
        font-size: 1.3rem;
    }
    
    .form-group {
        padding: 0.8rem 1.5rem;
    }
    
    .submit-btn {
        margin: 1rem 1.5rem 1.8rem;
        width: calc(100% - 3rem);
    }
}

@media (max-width: 480px) {
    .hero-section {
        padding: 2.5rem 1rem;
    }
    
    .hero-section h1 {
        font-size: 1.9rem;
    }
    
    .add-prompt-btn span {
        display: none;
    }
    
    .add-prompt-btn {
        padding: 0.6rem;
        border-radius: 100%;
        width: 500px;
        justify-content: center;
    }
    
    .search-bar {
        max-width: 200px;
    }
}
    </style>
</head>
<body>

<div class="header">
    <div class="logo">Vortex<span>Prompt</span></div>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search prompts...">
        <button id="searchBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </div>
    <button class="add-prompt-btn" id="addPromptBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Prompt
    </button>
</div>

<main>
    <div class="hero-section">
        <h1>Prompt Collection</h1>
        <p>Discover, save, and organize your favorite AI prompts</p>
    </div>
    <div class="prompts-grid" id="promptsGrid"></div>
</main>

<div class="modal-overlay" id="addModal">
    <div class="modal-container">
        <div class="modal-header">
            <h2>Add New Prompt</h2>
            <button class="close-modal" id="closeModalBtn">×</button>
        </div>
        <form id="addPromptForm">
            <div class="form-group">
                <label>Prompt Title</label>
                <input type="text" id="promptTitle" placeholder="e.g., Cinematic Portrait, Futuristic City..." required>
            </div>
            <div class="form-group">
                <label>Image URL (reference photo)</label>
                <input type="url" id="promptImage" placeholder="https://example.com/image.jpg" required>
                <small>Paste a direct image URL for reference</small>
            </div>
            <div class="form-group">
                <label>Prompt Text</label>
                <textarea id="promptText" rows="6" placeholder="Write your prompt here..." required></textarea>
            </div>
            <div class="form-group">
                <label>Category (optional)</label>
                <input type="text" id="promptCategory" placeholder="e.g., Portrait, Landscape, Fantasy...">
            </div>
            <button type="submit" class="submit-btn">Save Prompt</button>
        </form>
    </div>
</div>

<div id="detailPage" class="detail-page">
    <div class="close-detail" id="closeDetailBtn">×</div>
    <div class="detail-container">
        <div class="detail-image-section" id="detailImageSection"></div>
        <div class="detail-content-section">
            <div class="detail-header">
                <h1 id="detailTitle"></h1>
                <span class="detail-category" id="detailCategory"></span>
            </div>
            <div class="detail-prompt-box">
                <div class="prompt-label">Prompt Text</div>
                <div class="prompt-text" id="detailPrompt"></div>
                <button class="copy-btn" id="copyPromptBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                    Copy Prompt
                </button>
            </div>
        </div>
        <div class="detail-footer">
            <span>© 2025 Vortex Prompt - Share Your Creativity</span>
        </div>
    </div>
</div>

<script>
    let promptsData = [];

    function loadPrompts() {
        const saved = localStorage.getItem('vortex_prompts');
        if (saved) {
            promptsData = JSON.parse(saved);
        } else {
            promptsData = [
                {
                    id: Date.now() + 1,
                    title: "Cinematic Portrait Masterpiece",
                    imageUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600",
                    promptText: "Cinematic portrait of a mysterious woman, soft natural lighting, depth of field, 85mm lens, moody atmosphere, golden hour, photorealistic, 8k resolution, professional photography",
                    category: "Portrait"
                },
                {
                    id: Date.now() + 2,
                    title: "Futuristic Cyberpunk City",
                    imageUrl: "https://images.unsplash.com/photo-1546445317-29c454f1ceb3?w=600",
                    promptText: "Futuristic cyberpunk city at night, neon lights reflections on wet streets, flying cars, holographic billboards, purple and blue tones, detailed architecture, cinematic lighting, unreal engine 5 render",
                    category: "Landscape"
                },
                {
                    id: Date.now() + 3,
                    title: "Ethereal Fantasy Forest",
                    imageUrl: "https://images.unsplash.com/photo-1448375240586-882707db888b?w=600",
                    promptText: "Ethereal fantasy forest with glowing mushrooms, ancient trees, misty atmosphere, magical creatures, golden sun rays through leaves, volumetric lighting, dreamlike, digital art, trending on artstation",
                    category: "Fantasy"
                }
            ];
            savePrompts();
        }
        renderPrompts();
    }

    function savePrompts() {
        localStorage.setItem('vortex_prompts', JSON.stringify(promptsData));
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderPrompts(filterText = '') {
        const grid = document.getElementById('promptsGrid');
        let filtered = promptsData;
        
        if (filterText.trim() !== '') {
            const searchLower = filterText.toLowerCase();
            filtered = promptsData.filter(prompt => 
                prompt.title.toLowerCase().includes(searchLower) || 
                prompt.promptText.toLowerCase().includes(searchLower) ||
                (prompt.category && prompt.category.toLowerCase().includes(searchLower))
            );
        }
        
        if (filtered.length === 0) {
            grid.innerHTML = '<div class="empty-state">✨ No prompts found. Create your first prompt!</div>';
            return;
        }
        
        grid.innerHTML = filtered.map(prompt => `
            <div class="prompt-card" data-id="${prompt.id}">
                <img class="prompt-card-image" src="${prompt.imageUrl}" alt="${escapeHtml(prompt.title)}" onerror="this.src='https://placehold.co/600x400/1a1535/6c63ff?text=No+Image'">
                <div class="prompt-card-content">
                    <div class="prompt-card-title">${escapeHtml(prompt.title)}</div>
                    ${prompt.category ? `<div class="prompt-card-category">${escapeHtml(prompt.category)}</div>` : ''}
                    <div class="prompt-card-preview">${escapeHtml(prompt.promptText.substring(0, 100))}${prompt.promptText.length > 100 ? '...' : ''}</div>
                </div>
            </div>
        `).join('');
        
        document.querySelectorAll('.prompt-card').forEach(card => {
            card.addEventListener('click', () => {
                const id = parseInt(card.dataset.id);
                const prompt = promptsData.find(p => p.id === id);
                if (prompt) openDetailPage(prompt);
            });
        });
    }

    function openDetailPage(prompt) {
        const detailPage = document.getElementById('detailPage');
        const detailImageSection = document.getElementById('detailImageSection');
        const detailTitle = document.getElementById('detailTitle');
        const detailCategory = document.getElementById('detailCategory');
        const detailPrompt = document.getElementById('detailPrompt');
        
        detailImageSection.innerHTML = `<img src="${prompt.imageUrl}" alt="${escapeHtml(prompt.title)}" onerror="this.src='https://placehold.co/800x500/1a1535/6c63ff?text=Image+Not+Found'">`;
        detailTitle.textContent = prompt.title;
        detailCategory.textContent = prompt.category || 'Uncategorized';
        detailPrompt.textContent = prompt.promptText;
        
        detailPage.dataset.currentId = prompt.id;
        detailPage.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeDetailPage() {
        const detailPage = document.getElementById('detailPage');
        detailPage.classList.remove('active');
        document.body.style.overflow = '';
    }

    async function copyPromptText() {
        const detailPage = document.getElementById('detailPage');
        const id = parseInt(detailPage.dataset.currentId);
        const prompt = promptsData.find(p => p.id === id);
        if (prompt) {
            try {
                await navigator.clipboard.writeText(prompt.promptText);
                const copyBtn = document.getElementById('copyPromptBtn');
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            } catch (err) {
                alert('Failed to copy text');
            }
        }
    }

    function showAddModal() {
        const modal = document.getElementById('addModal');
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeAddModal() {
        const modal = document.getElementById('addModal');
        modal.classList.remove('active');
        document.body.style.overflow = '';
        document.getElementById('addPromptForm').reset();
    }

    function addNewPrompt(event) {
        event.preventDefault();
        
        const title = document.getElementById('promptTitle').value.trim();
        const imageUrl = document.getElementById('promptImage').value.trim();
        const promptText = document.getElementById('promptText').value.trim();
        const category = document.getElementById('promptCategory').value.trim();
        
        if (!title || !imageUrl || !promptText) {
            alert('Please fill in all required fields');
            return;
        }
        
        const newPrompt = {
            id: Date.now(),
            title: title,
            imageUrl: imageUrl,
            promptText: promptText,
            category: category || ''
        };
        
        promptsData.unshift(newPrompt);
        savePrompts();
        renderPrompts();
        closeAddModal();
        
        const btn = event.submitter;
        const originalText = btn.textContent;
        btn.textContent = '✓ Saved!';
        setTimeout(() => {
            btn.textContent = originalText;
        }, 1500);
    }

    function searchPrompts() {
        const searchInput = document.getElementById('searchInput');
        const query = searchInput.value;
        renderPrompts(query);
    }

    document.getElementById('searchBtn').addEventListener('click', searchPrompts);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchPrompts();
    });

    document.getElementById('addPromptBtn').addEventListener('click', showAddModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeAddModal);
    document.getElementById('addModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('addModal')) closeAddModal();
    });
    document.getElementById('addPromptForm').addEventListener('submit', addNewPrompt);

    document.getElementById('closeDetailBtn').addEventListener('click', closeDetailPage);
    document.getElementById('detailPage').addEventListener('click', (e) => {
        if (e.target === document.getElementById('detailPage')) closeDetailPage();
    });
    document.getElementById('copyPromptBtn').addEventListener('click', copyPromptText);

    loadPrompts();
</script>
</body>
</html>
